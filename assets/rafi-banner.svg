<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">RAFI — Developer Profile</title><desc id="desc">A glass-inspired purple gradient banner for RAFI.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100d20"/><stop offset=".55" stop-color="#25164a"/><stop offset="1" stop-color="#111827"/></linearGradient>
 <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9ddff" stop-opacity=".8"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".15"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#a78bfa" stop-opacity=".55"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
